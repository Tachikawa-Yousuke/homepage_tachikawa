# GitHub Pages への自動デプロイ
# main ブランチへの push で Astro をビルドし、GitHub Pages に公開します。
# 事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にすること。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build
        env:
          # configure-pages が公開 URL を教えてくれるので、astro.config.mjs に渡す
          #   組織/個人リポジトリ: origin=https://<owner>.github.io, base_path=/<repo名>
          #   独自ドメイン:       origin=https://example.ac.jp, base_path=（空）
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 秘密情報が必要な場合はここに追加する（コードに直書きしない）
          # PUBLIC_MAP_API_KEY: ${{ secrets.PUBLIC_MAP_API_KEY }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
