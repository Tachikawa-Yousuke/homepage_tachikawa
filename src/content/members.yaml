- id: kimura
  name: 木村 康裕
  nameEn: Yasuhiro KIMURA
  role: 准教授（主宰・PI）
  roleEn: Associate Professor, Principal Investigator
  group: faculty
  order: 1
  interests: [原子拡散, 金属ナノワイヤ創製, その場TEM観察, エレクトロマイグレーション]
  bio: >-
    2010年に茨城工業高等専門学校を卒業後、東北大学工学部機械知能・航空工学科に編入学。
    エレクトロマイグレーションによる金属マイクロ・ナノワイヤ創製技術の研究に取り組み、2017年に東北大学で博士号を取得、助教に着任。
    2019年に名古屋大学工学研究科マイクロ・ナノ機械理工学専攻 助教。2020年11月からJSTさきがけ研究者（2025年3月まで）。
    2024年9月より九州大学大学院工学研究院機械工学部門 准教授。
    「誰もが簡単に小さなモノづくりを」実現する新技術創出をミッションに、基礎研究と社会実装の両面を推進している。
